[package]
name = "lists-web"
version = "0.8.6-rc.1"
edition = "2021"
authors = ["Denis Evsyukov <https://denis.evsyukov.org>"]
license = "MIT"
publish = false
description = "Self-hosted web interface for Lists: one more device in the sync, reachable from a browser"

[dependencies]
lists-core = { path = "../core" }
aes-gcm = "0.11"
base64 = "0.23"
hkdf = "0.13"
# The scratch image has no system time zone database.
jiff = { version = "1", features = ["tzdb-bundle-always"] }
p256 = { version = "0.14", features = ["ecdh", "ecdsa", "getrandom"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1"
sha2 = "0.11"
tiny_http = "0.12"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
