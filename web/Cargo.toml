[package]
name = "lists-web"
version = "0.7.0"
edition = "2021"
license = "MIT"
publish = false
description = "Self-hosted web interface for Lists: one more device in the sync, reachable from a browser"

[dependencies]
lists-core = { path = "../core" }
aes-gcm = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
hkdf = "0.12"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
