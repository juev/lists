# lists-web behind a loopback port. Copy .env.example to .env next to this
# file and fill in LISTS_WEB_PASSWORD and the sync settings (docs/self-hosting.md).
services:
  lists:
    image: ghcr.io/juev/lists:${LISTS_VERSION:-latest}
    restart: unless-stopped
    # The server writes only to /data, temporary files included (#334); it needs no
    # capability and never gains a privilege. scripts/check-image.sh runs it so.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${LISTS_PORT:-8080}:8080"
    volumes:
      - lists-data:/data
    environment:
      LISTS_WEB_PASSWORD: ${LISTS_WEB_PASSWORD:?set LISTS_WEB_PASSWORD in .env}
      LISTS_SYNC: ${LISTS_SYNC:-off}
      LISTS_SYNC_URL: ${LISTS_SYNC_URL:-}
      LISTS_SYNC_USER: ${LISTS_SYNC_USER:-}
      LISTS_SYNC_PASSWORD: ${LISTS_SYNC_PASSWORD:-}
      LISTS_SYNC_PASSPHRASE: ${LISTS_SYNC_PASSPHRASE:-}
      LISTS_PUSH_SERVER: ${LISTS_PUSH_SERVER:-}
      # The address the browser sees, and the contact for Web Push (R146).
      LISTS_WEB_URL: ${LISTS_WEB_URL:-}
      LISTS_VAPID_SUBJECT: ${LISTS_VAPID_SUBJECT:-}
      # R136: attachment limits of this server, in megabytes; 0 disables one.
      LISTS_MAX_FILE_MB: ${LISTS_MAX_FILE_MB:-512}
      LISTS_MAX_TASK_MB: ${LISTS_MAX_TASK_MB:-2048}
      # Requests come through the reverse proxy; the client is in X-Forwarded-For (R134).
      LISTS_TRUST_PROXY: "1"

volumes:
  lists-data:
