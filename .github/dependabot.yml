# The actions are pinned by commit and the build image by digest; Dependabot
# proposes the new pins together with the version in the comment next to them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # The Rust workspaces: patch and minor releases of the crates come as one pull
  # request per workspace, a major release on its own.
  - package-ecosystem: cargo
    directories:
      - /core
      - /web
    schedule:
      interval: weekly
    groups:
      crates:
        update-types:
          - patch
          - minor
