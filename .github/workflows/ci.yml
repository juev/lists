name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core and web server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release tags: check-version.sh compares the build number with theirs.
          fetch-depth: 0
      - name: Install the Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            core
            web
      - name: Check versions
        run: ./scripts/check-version.sh
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2
      - name: Check the dependencies
        run: make deny
      - name: Check that the build changed no tracked file
        run: ./scripts/check-clean-tree.sh

  android:
    name: Android app
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request is checked out as a merge commit: its first parent is the base branch.
          fetch-depth: 2
      # The release APK takes three of the job's six minutes, and only a change to the app, the
      # core it bundles or the build can break it. A pull request that touches none of them skips
      # it; a push to main always runs it, so a tag is never the first release build.
      - name: Check whether the change reaches the release APK
        id: release
        run: |
          changed=''
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            changed="$(git diff --name-only HEAD^1 HEAD)"
          fi
          if [[ "$GITHUB_EVENT_NAME" != 'pull_request' ]] ||
            grep -qE '^(android/|core/|rust-toolchain\.toml$|scripts/(build|check-launch)-android\.sh$|\.github/workflows/ci\.yml$)' <<< "$changed"; then
            echo 'check=true' >> "$GITHUB_OUTPUT"
          else
            echo 'The change does not reach the release APK: its build and start are skipped'
            echo 'check=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install ktlint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ktlint" https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint
          echo "a3fd620207d5c40da6ca789b95e7f823c54e854b7fade7f613e91096a3706d75  $RUNNER_TEMP/ktlint" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/ktlint"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Lint the Kotlin
        run: make android-lint
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android SDK packages
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build the debug APK
        run: make android
      # The release goes through R8, and a rule missing from proguard-rules.pro is a crash at run
      # time, not a build error. The APK is built as published, but for the x86_64 emulator and
      # signed with the debug key; the tag workflow builds the signed arm64 one.
      - name: Build the release APK for the emulator
        if: steps.release.outputs.check == 'true'
        working-directory: android
        env:
          LISTS_ANDROID_ABIS: x86_64
          LISTS_RELEASE_DEBUG_SIGNING: '1'
        run: ./gradlew --quiet assembleRelease
      - name: Enable KVM
        if: steps.release.outputs.check == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start the release APK
        if: steps.release.outputs.check == 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: ./scripts/check-launch-android.sh android/app/build/outputs/apk/release/app-release.apk emulator-5554
      - name: Check that the build changed no tracked file
        run: ./scripts/check-clean-tree.sh

  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Install SwiftLint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
          echo "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 --check --strict
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      - name: Lint the Swift
        run: make apple-lint
      - name: Install the Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
      # Both architectures, as the release builds them (#375); a Debug build alone makes only the active one.
      - name: Build the app
        run: ./scripts/build-apple-app.sh Debug ONLY_ACTIVE_ARCH=NO
      - name: Check that the app runs on Apple silicon and Intel
        run: ./scripts/check-universal.sh apple/build/Build/Products/Debug/Lists.app
      - name: Run the Swift tests
        run: make apple-test
      # A build that compiles can still stop at launch, as 0.3.1 did (#239, #240).
      - name: Start the app
        run: ./scripts/check-launch.sh apple/build/Build/Products/Debug/Lists.app debug
      - name: Check that the build changed no tracked file
        run: ./scripts/check-clean-tree.sh

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: lists:ci
          cache-from: type=gha,scope=image-amd64
          cache-to: type=gha,scope=image-amd64,mode=max
      - name: Start the image as compose.yaml does and upload a file
        run: ./scripts/check-image.sh lists:ci
      # Trivy reads the Dockerfile; it finds no packages in the image, whose only program is a
      # static binary: the dependencies of that binary are checked by cargo-deny in the core job.
      - name: Check the Dockerfile with Trivy
        run: >-
          docker run --rm -v "$PWD:/src:ro"
          aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          config --exit-code 1 /src
