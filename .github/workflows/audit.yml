name: Audit

# CI runs on pushes and pull requests only, so an advisory published in a quiet
# week would wait for the next change. This run checks the dependencies every
# day; a failure mails the maintainer.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    name: Dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-deny@0.20.2
      - name: Check the dependencies
        run: make deny
