name: Diag macos launch

# Throwaway: builds the macOS disk image only and records what the release launch check cannot.
on:
  push:
    branches: [hermes/release-launch-diag]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: macOS launch diagnostic
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Install the Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
      - name: Build the disk image
        run: ./scripts/release-macos.sh
      - name: Diagnose the launch
        run: chmod +x scripts/diag-launch.sh && ./scripts/diag-launch.sh dist/*.dmg
